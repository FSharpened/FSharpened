name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     runner: windows-latest }
          - { rid: win-arm64,   runner: windows-11-arm }
          - { rid: linux-x64,   runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: osx-x64,     runner: macos-13 }
          - { rid: osx-arm64,   runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build FSharpened.slnx -c Release
      - run: dotnet test FSharpened.slnx -c Release --no-build
      - run: dotnet fantomas --check .
      # NativeAOT is RID-specific: validate per RID, never infer from another.
      - run: dotnet publish tools/FSharpened.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true
      - run: python tools/scripts/check_docs.py
      # TODO(P0.5.4): ONNX model load + inference smoke test per RID.
