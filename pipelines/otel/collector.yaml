# Reference OpenTelemetry Collector config for FSharpened workloads
# (compiler Meter/ActivitySource via FSHARP_OTEL_EXPORT, pipeline spans, analyzer spans, model inference spans).
receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
