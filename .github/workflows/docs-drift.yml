name: docs-drift
on:
  pull_request:
    paths: ['**.md', 'registry/**', 'src/**', '.agents/**', 'tools/scripts/**']

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/scripts/check_docs.py
      # TODO(P0.5.3): semantic API-signature drift via FSharpened.Semantic.
