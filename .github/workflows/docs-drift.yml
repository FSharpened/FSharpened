name: docs-drift
on:
  pull_request:
    paths: ['**.md', 'registry/**', 'src/**', '.agents/**', 'tools/scripts/**']
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python tools/scripts/check_docs.py
