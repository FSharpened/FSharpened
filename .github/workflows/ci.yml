name: ci
# Same pipeline as a developer runs locally: python tools/ci/fsh_ci.py run --profile full
# (preflight, docs-drift, runner self-tests, Fantomas, restore, strict build, tests, per-RID NativeAOT publish + run,
# Rust reference crate).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     runner: windows-latest,   experimental: false }
          - { rid: win-arm64,   runner: windows-11-arm,   experimental: true }   # AOT toolchain on arm64 runners unverified
          - { rid: linux-x64,   runner: ubuntu-latest,    experimental: false }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm, experimental: false }
          - { rid: osx-x64,     runner: macos-15-intel,   experimental: false }
          - { rid: osx-arm64,   runner: macos-latest,     experimental: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Latest 9.0.x, not the exact global.json pin: older SDKs bundle an AOT compiler with known
          # advisories, which strict mode (NuGetAudit warnings as errors) rejects.
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rust toolchain (stable, with rustfmt and clippy)
        # Interop.Rust (ADR-0019) needs cargo on every RID. GitHub's runner images ship rustup; this pins the
        # channel and components without a third-party action. A runner with no rustup fails here, loudly.
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
          cargo --version
          rustc -vV
      - name: fsh-ci (full profile, NativeAOT and Rust required)
        env:
          # Optional telemetry (docs/operations/hub.md); empty on forks, in which case publishing is skipped.
          FSH_HUB_URL: ${{ vars.HUB }}
          FSH_HUB_TOKEN: ${{ secrets.FSH_HUB_TOKEN }}
        run: python tools/ci/fsh_ci.py run --profile full --ci --require-aot --require-rust --jobs 2
      - name: Job summary
        if: always()
        shell: bash
        run: |
          latest=$(ls -d .fsharpened/ci/runs/* 2>/dev/null | tail -1)
          [ -n "$latest" ] && cat "$latest/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsh-ci-${{ matrix.rid }}
          path: .fsharpened/ci/runs/**
          retention-days: 14
