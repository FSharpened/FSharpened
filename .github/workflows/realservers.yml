name: realservers
# Opt-in verification of the desktop IDE's language-server client against REAL servers (docs/operations/desktop.md).
# Manual, and weekly so a server release that breaks the client shows up. Linux x64 only. Never part of ci.yml:
# the normal test run does not depend on any of these programs.
#   python tools/ci/fsh_ci.py run --profile verify
# The job installs the servers from their own distribution channels and runs the same program a developer runs locally.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: realservers
  cancel-in-progress: true

jobs:
  verify:
    name: real servers (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install gopls
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install rust-analyzer and the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rust-analyzer --component rust-src --no-self-update
          rustup default stable
      - name: Install pyright and typescript-language-server
        run: npm install -g pyright typescript@5 typescript-language-server
      - name: Install clangd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clangd
      - name: Install lua-language-server (pinned release, checksum checked)
        run: |
          version=3.19.2
          curl -sSLf -o lua-ls.tar.gz "https://github.com/LuaLS/lua-language-server/releases/download/${version}/lua-language-server-${version}-linux-x64.tar.gz"
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  lua-ls.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/lua-ls"
          tar -xzf lua-ls.tar.gz -C "$HOME/lua-ls"
          echo "$HOME/lua-ls/bin" >> "$GITHUB_PATH"
      - name: fsh-ci verify profile (per-server report below)
        run: python tools/ci/fsh_ci.py run --profile verify --ci --jobs 2
      - name: Job summary
        if: always()
        run: |
          latest=$(ls -d .fsharpened/ci/runs/* 2>/dev/null | tail -1)
          [ -n "$latest" ] && cat "$latest/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: realservers-logs
          path: .fsharpened/ci/runs/**
          retention-days: 14
